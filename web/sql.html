<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intérprete SQL · Furlantran</title>
  <style>
    :root {
      --bg: #1e1e2e; --panel: #181825; --header: #0f0f1a; --input: #24243a;
      --accent: #7c3aed; --accent-hover: #6d28d9; --accent-2: #a78bfa;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d2d4a;
      --ok: #10b981; --err: #ef4444; --warn: #f59e0b;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { background: var(--header); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 16px; margin: 0; margin-right: auto; }
    header a { color: var(--accent-2); font-size: 13px; text-decoration: none; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--input); border: 1px solid var(--border); }
    main { flex: 1; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr); min-height: 0; }
    section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
    #source { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 0; padding: 14px; font: 14px/1.5 var(--mono); outline: none; tab-size: 2; }
    .tabs { display: flex; background: var(--header); border-bottom: 1px solid var(--border); }
    .tabs button { background: transparent; color: var(--muted); border-radius: 0; border-bottom: 2px solid transparent; }
    .tabs button.active { color: var(--text); border-bottom-color: var(--accent-2); }
    .tabs .badge { background: var(--err); color: #fff; border-radius: 9px; padding: 0 6px; margin-left: 6px; font-size: 11px; }
    #output { flex: 1; overflow: auto; padding: 12px 14px; font: 13px/1.5 var(--mono); background: var(--panel); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .err { color: var(--err); } .ok { color: var(--ok); } .muted { color: var(--muted); }
    .diag { padding: 6px 0; border-bottom: 1px solid var(--border); }
    .phase { display: inline-block; min-width: 76px; font-weight: 700; text-transform: uppercase; font-size: 11px; }
    details { margin-left: 14px; } summary { cursor: pointer; margin-left: -14px; }
    .leaf { margin-left: 14px; }
    .name { color: var(--accent-2); } .val { color: var(--warn); }
    #status { padding: 6px 14px; background: var(--header); border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Intérprete SQL con almacenamiento en archivos</h1>
    <a href="index.html">← Compiscript IDE</a>
    <button id="btn-sample" class="secondary">Ejemplo</button>
    <button id="btn-analyze" class="secondary" title="Ctrl+Shift+Enter">Analizar</button>
    <button id="btn-run" title="Ctrl+Enter">▶ Ejecutar</button>
  </header>
  <main>
    <section><textarea id="source" spellcheck="false" placeholder="Escribe sentencias SQL separadas por ;"></textarea></section>
    <section style="border-right:0">
      <div class="tabs" id="tabs"></div>
      <div id="output"></div>
    </section>
  </main>
  <div id="status">Listo.</div>
  <script src="sql.js"></script>
</body>
</html>
